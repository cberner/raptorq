name: Wheels

# Builds and tests the Python wheels and sdist that `just publish_py` uploads to PyPI.
# This workflow never publishes and has no access to any PyPI credentials.
on:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - ".github/workflows/wheels.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2014"
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2014"
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            manylinux: "off"
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist

      - name: Test wheel
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist raptorq
          python -m unittest discover

      - uses: actions/upload-artifact@v6
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v6
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  bundle:
    name: Bundle release artifacts
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Check artifact count
        run: |
          ls -l dist
          test "$(ls dist/*.whl | wc -l)" -eq 5
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1

      - uses: actions/upload-artifact@v6
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error
