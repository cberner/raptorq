name: Wheels

on:
  pull_request:
    paths:
      - ".github/workflows/wheels.yml"
      - "Cargo.toml"
      - "pyproject.toml"
      - "rust-toolchain"
      - "src/**"
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_17"
            artifact: linux-x86_64
          - name: Linux aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_17"
            artifact: linux-aarch64
          - name: macOS x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: "off"
            artifact: macos-x86_64
          - name: macOS arm64
            os: macos-14
            target: aarch64-apple-darwin
            manylinux: "off"
            artifact: macos-arm64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            manylinux: "off"
            artifact: windows-x86_64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          maturin-version: v1.15.0
          rust-toolchain: "1.93"
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out target/wheels --compatibility pypi

      - name: Test installed wheel
        shell: bash
        run: |
          python -m pip install --force-reinstall target/wheels/*.whl
          python -m unittest discover -s test -v

      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.artifact }}
          path: target/wheels/*.whl
          if-no-files-found: error

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: v1.15.0
          rust-toolchain: "1.93"
          args: --out target/wheels

      - uses: actions/upload-artifact@v4
        with:
          name: python-sdist
          path: target/wheels/*.tar.gz
          if-no-files-found: error

  bundle:
    name: Release bundle
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: target/wheels
          merge-multiple: true

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: target/wheels/*
          if-no-files-found: error
